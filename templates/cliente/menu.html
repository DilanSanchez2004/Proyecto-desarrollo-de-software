<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>

    <link rel="stylesheet" href="/Proyecto-desarrollo-de-software/static/css/menu.css"/>

    <!--fuente para los iconos-->
    <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

</head>

<body>
    <header class="header">
        <nav class="header--menu">
            <div class="burger--icon">
                <i class="fa-solid fa-bars"></i>
            </div>
            <div class="search--box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="buscar">
            </div>
            <div class="menu--icons">
                <i class="fa-solid fa-bowl-food"></i>
                <div class="cart-icon">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>0</span> 
                </div>
            </div>
            
        </nav>
    </header>


    <section class="cover">
        <div class="cover--overlay">
        <h1>Bocado rapido</h1>
        <span class="slogan">Donde el gusto toma la delantera</span>
        </div>
    </section>

    <main>
        <h2 class="section-heading"> Menu</h2>
        <div class="menu--list">
            <div class="menu--item">
                <img src="/Proyecto-desarrollo-de-software/static/img/hamburguesa.png" alt="">
                <h5>Hamburguesa</h5>
            </div>
            <div class="menu--item">
                <img src="/Proyecto-desarrollo-de-software/static/img/Pizza.png" alt="">
                <h5>Pizza</h5>
            </div>
                        <div class="menu--item">
                <img src="/Proyecto-desarrollo-de-software/static/img/batidos.png" alt="">
                <h5>Batido</h5>
                        </div>
                        <div class="menu--item">
                <img src="/Proyecto-desarrollo-de-software/static/img/ensaladas.png" alt="">
                <h5>Ensalada</h5>
                        </div>
                        <div class="menu--item">
                <img src="/Proyecto-desarrollo-de-software/static/img/espaguetis.png" alt="">
                <h5>espaguetis</h5>
                        </div>
                        <div class="menu--item">
                <img src="/Proyecto-desarrollo-de-software/static/img/nuggets.png" alt="">
                <h5>nuggets</h5>
                        </div>
                        <div class="menu--item">
                <img src="/Proyecto-desarrollo-de-software/static/img/jugos.png" alt="">
                <h5>Bebidas</h5>
                        </div>
                        <div class="menu--item">
                <img src="/Proyecto-desarrollo-de-software/static/img/cafe.png" alt="">
                <h5>Cafe</h5>
                        </div>
                        <div class="menu--item">
                <img src="/Proyecto-desarrollo-de-software/static/img/cerveza.png" alt="">
                <h5>cerveza</h5>
                        </div>
        </div>


        <!--elementos del carrito-->

        <h2 class="section--heading">Elementos seleccionados</h2>
        <div class="card--list">
            <div class="card">
                <img src="/Proyecto-desarrollo-de-software/static/img/ensaladas.png" alt="">
                <h4 class="card--title">ensalada</h4>
                
                <div class="card--price">
                    <div class="price">19.500</div>
                    <i class="fa-solid fa-plus add-to-cart"></i>
                </div>
                </div>
                        <div class="card">
                <img src="/Proyecto-desarrollo-de-software/static/img/Hamburguesa.png" alt="">
                <h4 class="card--title">Hamburguesa</h4>
                
                <div class="card--price">
                    <div class="price">19.500</div>
                    <i class="fa-solid fa-plus add-to-cart"></i>
                </div>
            </div>
        </div>


        <!--carrito de compras--> 

        <div class="sidebar" id="sidebar">
            <div class="sidebar-close">
                <i class="fa-solid fa-close"></i>
            </div>
                <div class="cart-menu">
                    <h3>Mi carrito de compras</h3>
                    <div class="cart-tems"></div>
                </div>

                <div class="sidebar--footer">
                    <div class="total--amount">
                        <h5>Total</h5>
                        <div class="cart-total">$0.00</div>
                    </div>
                    <button class="checkout-btn">comprar</button>
                </div>
        </div>
    </main>
<script src="/Proyecto-desarrollo-de-software/static/js/carrito.js"></script>
</body>
</html>
